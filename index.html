<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FTMO Bot — How It Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090e; --bg2:#10101a; --bg3:#16161f; --card:#13131c;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.1);
  --gold:#c9a84c; --gold-s:rgba(201,168,76,0.13); --gold-g:rgba(201,168,76,0.06);
  --green:#3ecf8e; --green-s:rgba(62,207,142,0.1);
  --red:#f06060; --red-s:rgba(240,96,96,0.1);
  --blue:#5b9cf6; --blue-s:rgba(91,156,246,0.1);
  --purple:#a78bfa; --purple-s:rgba(167,139,250,0.1);
  --text:#ddddd5; --text2:#7a7a85; --text3:#3e3e4a;
  --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
  --nav:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.65}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);
  background-size:48px 48px}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--nav);
  background:rgba(9,9,14,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.nav-brand{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold);
  letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.nav-r{display:flex;align-items:center;gap:10px}
.nav-badge{font-family:var(--mono);font-size:9px;color:var(--text3);
  border:1px solid var(--border);border-radius:20px;padding:2px 8px;letter-spacing:.08em}
.nav-clk{font-family:var(--mono);font-size:10px;color:var(--text3)}

/* ── DESKTOP LAYOUT ── */
.shell{position:fixed;top:var(--nav);left:0;right:0;bottom:0;
  display:grid;grid-template-columns:1fr 400px;z-index:1}

/* ── DIAGRAM PANE ── */
.diag{overflow-y:auto;overflow-x:hidden;padding:24px 20px;
  border-right:1px solid var(--border)}
.diag::-webkit-scrollbar{width:3px}
.diag::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.diag-hint{font-family:var(--mono);font-size:9px;color:var(--text3);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.diag-hint::after{content:'';flex:1;height:1px;background:var(--border)}

/* SVG node interactivity */
.sn{cursor:pointer}
.sn .nr{transition:stroke .15s,filter .15s}
.sn:hover .nr{stroke:rgba(201,168,76,0.5)!important;filter:brightness(1.2)}
.sn.active .nr{stroke:var(--gold)!important;filter:brightness(1.35)}
.sn.active .nt{fill:#ddddd5!important}
.sn .nh{fill:transparent}

/* ── DESKTOP EXPLAIN PANE ── */
.explain{display:flex;flex-direction:column;overflow:hidden}
.ex-head{padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
.ex-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase}
.ex-name{font-family:var(--mono);font-size:11px;color:var(--text2);max-width:200px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-body{flex:1;overflow-y:auto;padding:28px 24px}
.ex-body::-webkit-scrollbar{width:3px}
.ex-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Welcome */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:12px;opacity:.35}
.wg{font-family:var(--mono);font-size:32px;color:var(--gold)}
.welcome h3{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text2)}
.welcome p{font-size:12px;color:var(--text3);max-width:220px}

/* Tap hint — mobile only */
.tap-hint{display:none;font-family:var(--mono);font-size:9px;color:var(--text3);
  text-align:center;padding:6px;letter-spacing:.1em}

/* ── MOBILE BOTTOM SHEET ── */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);
  z-index:400;transition:background .3s;pointer-events:none}
.sheet-overlay.open{background:rgba(0,0,0,0.6);pointer-events:all}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;
  background:var(--bg2);border-top:1px solid var(--border2);
  border-radius:16px 16px 0 0;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{padding:12px 0 0;display:flex;justify-content:center;flex-shrink:0;cursor:pointer}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px}
.sheet-head{padding:0 20px 14px;display:flex;align-items:flex-start;
  justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title-wrap{flex:1}
.sheet-tag{font-family:var(--mono);font-size:9px;color:var(--text3);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.sheet-title{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text);line-height:1.2}
.sheet-close{background:var(--bg3);border:1px solid var(--border);
  border-radius:50%;width:28px;height:28px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;flex-shrink:0;margin-left:12px;
  font-size:14px;color:var(--text2);line-height:1}
.sheet-body{overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{display:none}

/* ── PANEL CONTENT (shared desktop+mobile) ── */
.panel{display:none}
.panel.show{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.p-tag{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.p-tag::before{content:'';width:14px;height:1px;background:var(--gold);opacity:.6}
.p-title{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);
  line-height:1.2;margin-bottom:16px}
.p-body{font-size:13px;color:var(--text2);line-height:1.8}
.p-body p{margin-bottom:12px}.p-body p:last-child{margin-bottom:0}
.p-body strong{color:var(--text);font-weight:500}
.hl{color:var(--gold);font-weight:500}.ok{color:var(--green);font-weight:500}
.warn{color:var(--red);font-weight:500}.info{color:var(--blue);font-weight:500}
.cb{background:var(--bg);border:1px solid var(--border);border-left:2px solid var(--gold);
  border-radius:6px;padding:12px 14px;margin:12px 0;font-family:var(--mono);
  font-size:11px;color:#a8d8a8;line-height:1.7;white-space:pre;overflow-x:auto}
.stats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;min-width:88px}
.sv{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:2px}
.sv.g{color:var(--green)}.sv.r{color:var(--red)}.sv.b{color:var(--blue)}
.sl{font-size:11px;color:var(--text3)}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
.tbl th{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;
  text-transform:uppercase;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 10px;color:var(--text2);border-bottom:1px solid var(--border)}
.tbl td:first-child{font-family:var(--mono);font-size:11px;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  html,body{overflow:auto;height:auto}
  .shell{position:static;display:block;padding-top:var(--nav);min-height:calc(100vh - var(--nav))}
  .diag{border-right:none;padding:16px 12px;overflow:visible}
  .explain{display:none}
  .tap-hint{display:block}
  .sheet-overlay{display:block}
}
</style>
</head>

    <div class="divider"></div>
    <p><span class="ok">1.</span> <strong>RR → 1.3</strong> — needs 2 weeks demo data first. Only needs 43.5% WR to break even.</p>
    <p><span class="ok">2.</span> <strong>Correlation guard</strong> — 1 USD position max. Kills the 3× simultaneous loss scenario.</p>
    <p><span class="ok">3.</span> <strong>News filter</strong> — block 30 min before NFP/FOMC/ECB. Spread filter misses pre-news candles.</p>`}
};

/* ── STATE ── */
let activeNode = null;
const isMobile = () => window.innerWidth <= 768;

/* ── TAP / CLICK HANDLER ── */
function tap(id, el) {
  const d = DATA[id]; if (!d) return;

  // Deactivate old node
  if (activeNode) activeNode.classList.remove('active');
  activeNode = el;
  el.classList.add('active');

  if (isMobile()) {
    // Populate sheet
    document.getElementById('s-tag').textContent = d.tag;
    document.getElementById('s-title').textContent = d.title;
    document.getElementById('s-body').innerHTML = `<div class="p-body">${d.body}</div>`;
    openSheet();
  } else {
    // Populate desktop panel
    document.getElementById('ex-name').textContent = d.title;
    document.getElementById('ex-body').innerHTML =
      `<div class="panel show">
        <div class="p-tag">${d.tag}</div>
        <div class="p-title">${d.title}</div>
        <div class="p-body">${d.body}</div>
      </div>`;
  }
}

/* ── SHEET CONTROLS ── */
function openSheet() {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Swipe down to close
let touchStartY = 0;
document.getElementById('sheet').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('sheet').addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 60) closeSheet();
}, {passive:true});

/* ── CLOCK ── */
function tick() {
  const isMob = window.innerWidth <= 768;
  const fmt = new Intl.DateTimeFormat('en-SG', {
    timeZone:'Asia/Singapore',
    hour:'2-digit', minute:'2-digit',
    ...(isMob ? {} : {second:'2-digit'}),
    hour12:false
  }).format(new Date());
  document.getElementById('clk').textContent = fmt + ' SGT';
}
tick(); setInterval(tick, 1000);

/* ── AUTO-OPEN FIRST NODE ON DESKTOP ── */
window.addEventListener('load', () => {
  if (!isMobile()) {
    const first = document.getElementById('n-mt5');
    if (first) tap('mt5', first);
  }
});
</script>
